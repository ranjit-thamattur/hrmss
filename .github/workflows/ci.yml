# Merge checks (decision record 0002). Runs on every pull request into qa or main, and on pushes to them.
name: CI

on:
  pull_request:
    branches: [main, qa]
  push:
    branches: [main, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrms
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENVIRONMENT: test
      AUTH_MODE: local
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (payroll, attendance, imports, F&F) and API tests
        run: pytest -q
      - name: Migration check (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://hrms:hrms@localhost:5432/hrms
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed
          python - <<'PY'
          # Audit log must be append-only: an UPDATE must fail
          from sqlalchemy import create_engine, text
          from app.config import get_settings
          eng = create_engine(get_settings().database_url)
          with eng.connect() as c:
              try:
                  c.execute(text("UPDATE audit_log SET actor='x'"))
                  c.commit()
                  raise SystemExit("audit_log accepted an UPDATE")
              except Exception as e:
                  if "append-only" not in str(e):
                      raise
                  print("audit_log is append-only: OK")
          PY
          alembic downgrade base
          alembic upgrade head
      - name: Dependency scan (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Dependency scan (npm audit, high and above)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
