# Merge checks (decision 0002). Runs on every pull request into qa or main, and on pushes to them.
# Layout (decision 0006): services/hrms-core (common), services/hotel_vivek_backend + _frontend (Hotel Vivek only).
name: CI

on:
  pull_request:
    branches: [main, qa]
  push:
    branches: [main, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrms_hv
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ENVIRONMENT: test
      AUTH_MODE: local
      JWT_SECRET: ci-only-secret
      MONITOR_INTERVAL_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/hrms-core/backend/requirements*.txt
      - name: Install
        working-directory: services/hrms-core/backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff) – core and Hotel Vivek
        run: |
          ruff check services/hrms-core/backend
          ruff check services/hotel_vivek_backend
      - name: No Peak Brain / chatbot code in HRMS (decision 0006)
        run: |
          if grep -rniE "peak ?brain|chatbot" services --include=*.py --include=*.js --include=*.jsx; then
            echo "Peak Brain / chatbot references found. HRMS is a standalone module (SCRUM-121, SCRUM-131)."; exit 1; fi
      - name: Core unit tests (payroll, attendance, imports, F&F, monitoring)
        working-directory: services/hrms-core/backend
        run: pytest
      - name: Hotel Vivek API tests (core + hotel_vivek package)
        working-directory: services/hotel_vivek_backend
        run: pytest -q
      - name: Migration check (Postgres, Hotel Vivek database)
        working-directory: services/hrms-core/backend
        env:
          DATABASE_URL: postgresql+psycopg://hrms:hrms@localhost:5432/hrms_hv
          TENANT: HV
          TENANT_PACKAGE: hotel_vivek
          TENANT_PATH: ../../hotel_vivek_backend
        run: |
          alembic upgrade head
          alembic check
          python -m app.startup
          python - <<'PY'
          # Audit log must be append-only: an UPDATE must fail
          from sqlalchemy import create_engine, text
          from app.config import get_settings
          eng = create_engine(get_settings().database_url)
          with eng.connect() as c:
              try:
                  c.execute(text("UPDATE audit_log SET actor='x'"))
                  c.commit()
                  raise SystemExit("audit_log accepted an UPDATE")
              except Exception as e:
                  if "append-only" not in str(e):
                      raise
                  print("audit_log is append-only: OK")
          PY
          alembic downgrade base
          alembic upgrade head
      - name: Dependency scan (pip-audit)
        working-directory: services/hrms-core/backend
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (core)
        working-directory: services/hrms-core/frontend
        run: npm install --no-audit --no-fund
      - name: Build core (neutral tenant)
        working-directory: services/hrms-core/frontend
        run: npm run build
      - name: Build Hotel Vivek
        working-directory: services/hotel_vivek_frontend
        run: npm run build
      - name: Dependency scan (npm audit, high and above)
        working-directory: services/hrms-core/frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
