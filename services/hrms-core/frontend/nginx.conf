server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }

  # health check for the monitoring dashboard (SCRUM-130)
  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  location / { try_files $uri /index.html; }
}
